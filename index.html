<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор банков в покере</title>
    <style>
        /* === Общие стили === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 14px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #f0e6d0, #c9b394);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .sub {
            font-size: 14px;
            color: #8b949e;
            background: #161b22;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #30363d;
        }

        /* === Сетка игроков === */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .player-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 12px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .player-card:hover {
            border-color: #484f58;
        }

        .player-card.all-in {
            border-color: #f0883e;
            box-shadow: 0 0 0 1px #f0883e55, 0 4px 12px rgba(240, 136, 62, 0.08);
        }

        .player-card.folded {
            border-color: #8b949e;
            opacity: 0.75;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .player-number {
            font-size: 14px;
            font-weight: 600;
            color: #c9d1d9;
        }

        .allin-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            cursor: pointer;
            user-select: none;
            padding: 2px 8px 2px 4px;
            border-radius: 16px;
            transition: background 0.15s, color 0.15s;
            background: transparent;
        }

        .allin-toggle:hover {
            background: #21262d;
        }

        .allin-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #f0883e;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }

        .allin-toggle .allin-label {
            transition: color 0.2s;
            letter-spacing: 0.3px;
        }

        .player-card.all-in .allin-toggle .allin-label {
            color: #f0883e;
        }

        .bet-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 16px;
            font-weight: 600;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        .bet-input::-webkit-outer-spin-button,
        .bet-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bet-input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px #58a6ff22;
        }

        .bet-input::placeholder {
            color: #484f58;
            font-weight: 400;
            font-size: 14px;
        }

        /* === Кнопки === */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }

        .btn {
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #238636;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .btn-danger {
            background: #da3633;
            color: #fff;
        }

        .btn-danger:hover {
            background: #f85149;
        }

        .actions .hint {
            font-size: 13px;
            color: #8b949e;
            margin-left: auto;
        }

        /* === Результаты === */
        .results {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 22px 24px 26px;
            margin-top: 8px;
            min-height: 100px;
        }

        .results h2 {
            font-size: 18px;
            font-weight: 600;
            color: #f0e6d0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .results h2 .count-badge {
            font-size: 13px;
            font-weight: 400;
            color: #8b949e;
            background: #0d1117;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .pots-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pot-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            padding: 12px 16px;
            background: #0d1117;
            border-radius: 10px;
            border-left: 4px solid #58a6ff;
            transition: background 0.15s;
        }

        .pot-item.main-pot {
            border-left-color: #f7c948;
            background: #1c170d;
        }

        .pot-item.side-pot {
            border-left-color: #58a6ff;
        }

        .pot-item .pot-name {
            font-weight: 600;
            font-size: 15px;
            min-width: 90px;
            color: #f0e6d0;
        }

        .pot-item .pot-size {
            font-size: 20px;
            font-weight: 700;
            color: #f7c948;
            min-width: 70px;
        }

        .pot-item .pot-size .currency {
            font-size: 14px;
            font-weight: 400;
            color: #8b949e;
            margin-left: 2px;
        }

        .pot-item .pot-eligible {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #c9d1d9;
        }

        .pot-item .pot-eligible .label {
            color: #8b949e;
            font-size: 13px;
            margin-right: 4px;
        }

        .player-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #21262d;
            border-radius: 20px;
            padding: 0 12px;
            height: 28px;
            font-size: 13px;
            font-weight: 600;
            color: #e6edf3;
            border: 1px solid #30363d;
            gap: 4px;
        }

        .player-chip.allin-chip {
            border-color: #f0883e;
            color: #f0883e;
            background: #2d1f0e;
        }

        .player-chip .chip-icon {
            font-size: 11px;
        }

        .pot-item .pot-return {
            font-size: 14px;
            color: #8b949e;
            margin-left: auto;
        }

        .pot-item .pot-return strong {
            color: #e6edf3;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: #8b949e;
        }

        .empty-state .icon {
            font-size: 44px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 15px;
        }

        .fold-note {
            font-size: 13px;
            color: #8b949e;
            margin-left: 8px;
        }

        @media (max-width: 700px) {
            .header h1 {
                font-size: 20px;
            }
            .header .sub {
                font-size: 12px;
                padding: 4px 12px;
            }
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .player-card {
                padding: 10px 10px 14px;
            }
            .bet-input {
                font-size: 15px;
                padding: 6px 8px;
            }
            .results {
                padding: 16px 14px 20px;
            }
            .pot-item {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                padding: 12px 14px;
            }
            .pot-item .pot-size {
                font-size: 18px;
            }
            .pot-item .pot-return {
                margin-left: 0;
            }
            .actions .hint {
                display: none;
            }
            .btn {
                padding: 8px 18px;
                font-size: 14px;
            }
        }

        @media (max-width: 450px) {
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }
            .allin-toggle {
                font-size: 11px;
                padding: 2px 4px 2px 2px;
            }
            .allin-toggle input[type="checkbox"] {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <h1>♠ Калькулятор банков</h1>
            <span class="sub">All‑In · Fold · Side Pots</span>
        </div>

        <div class="players-grid" id="playersGrid"></div>

        <div class="actions">
            <button class="btn btn-primary" id="calcBtn">🧮 Рассчитать</button>
            <button class="btn btn-secondary" id="clearBtn">✕ Очистить</button>
            <button class="btn btn-secondary" id="fillDemoBtn">📋 Пример</button>
            <span class="hint">All‑In / Fold (ставка < макс.)</span>
        </div>

        <div class="results" id="results">
            <h2>
                📊 Результат
                <span class="count-badge" id="potCountBadge">0 банков</span>
            </h2>
            <div id="potsContainer">
                <div class="empty-state">
                    <div class="icon">🃏</div>
                    <p>Введите ставки и нажмите «Рассчитать»</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. СОЗДАНИЕ КАРТОЧЕК (без текстового статуса)
        // ============================================================
        const PLAYER_COUNT = 10;
        const players = [];

        const grid = document.getElementById('playersGrid');

        for (let i = 1; i <= PLAYER_COUNT; i++) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.dataset.index = i;

            const header = document.createElement('div');
            header.className = 'player-header';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'player-number';
            nameSpan.textContent = `Игрок ${i}`;

            const toggleLabel = document.createElement('label');
            toggleLabel.className = 'allin-toggle';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.dataset.index = i;

            const labelSpan = document.createElement('span');
            labelSpan.className = 'allin-label';
            labelSpan.textContent = 'All‑in';

            toggleLabel.appendChild(checkbox);
            toggleLabel.appendChild(labelSpan);

            header.appendChild(nameSpan);
            header.appendChild(toggleLabel);

            const input = document.createElement('input');
            input.className = 'bet-input';
            input.type = 'number';
            input.min = 0;
            input.step = 1;
            input.value = '';
            input.placeholder = '0';
            input.dataset.index = i;

            card.appendChild(header);
            card.appendChild(input);
            grid.appendChild(card);

            players.push({
                index: i,
                card: card,
                input: input,
                checkbox: checkbox,
            });

            // При изменении чекбокса – обновляем класс all-in
            checkbox.addEventListener('change', () => {
                card.classList.toggle('all-in', checkbox.checked);
                if (checkbox.checked) card.classList.remove('folded');
            });

            // При вводе – снимаем folded, он пересчитается при расчете
            input.addEventListener('input', () => {
                card.classList.remove('folded');
            });

            // Клик для фокуса
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.allin-toggle') && e.target !== input) {
                    input.focus();
                }
            });
        }

        // ============================================================
        // 2. РАСЧЁТ БАНКОВ (с учётом Fold)
        // ============================================================
        function calculatePots(playerData) {
            // playerData: [{ index, bet, allIn }]
            const maxBet = Math.max(...playerData.map(p => p.bet), 0);

            const active = [];
            const folded = [];

            playerData.forEach(p => {
                if (p.bet === 0) return;
                // Активные: All‑in или те, кто не All‑in, но поставил максимальную ставку (уравняли)
                if (p.allIn || (p.bet === maxBet && !p.allIn)) {
                    active.push({ index: p.index, remaining: p.bet });
                } else {
                    folded.push({ index: p.index, remaining: p.bet });
                }
            });

            // Если нет активных, все ставки возвращаются
            if (active.length === 0) {
                const returns = playerData.filter(p => p.bet > 0).map(p => ({
                    playerIndex: p.index,
                    amount: p.bet
                }));
                return { pots: [], returns: returns };
            }

            const pots = [];
            let potIndex = 0;

            while (active.some(p => p.remaining > 0)) {
                const minActive = Math.min(...active.filter(p => p.remaining > 0).map(p => p.remaining));

                // Взносы фолдеров в этот банк
                let foldedContribution = 0;
                folded.forEach(f => {
                    if (f.remaining > 0) {
                        const contrib = Math.min(f.remaining, minActive);
                        foldedContribution += contrib;
                        f.remaining -= contrib;
                    }
                });

                const potSize = active.length * minActive + foldedContribution;
                const eligible = active.map(p => p.index);

                const potName = potIndex === 0 ? 'Main Pot' : `Side Pot ${potIndex}`;
                pots.push({
                    name: potName,
                    size: potSize,
                    eligible: eligible,
                    isMain: potIndex === 0,
                    foldedContribution: foldedContribution,
                });

                // Уменьшаем остатки активных
                active.forEach(p => {
                    p.remaining -= minActive;
                });
                // Удаляем тех, у кого остаток 0
                for (let i = active.length - 1; i >= 0; i--) {
                    if (active[i].remaining === 0) {
                        active.splice(i, 1);
                    }
                }

                potIndex++;
            }

            // Возвраты (избыток у активных, обычно один игрок)
            const returns = active.filter(p => p.remaining > 0).map(p => ({
                playerIndex: p.index,
                amount: p.remaining
            }));

            return { pots, returns };
        }

        // ============================================================
        // 3. ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ (банки с одним претендентом → возврат)
        // ============================================================
        function renderResults(pots, returns) {
            const container = document.getElementById('potsContainer');
            const badge = document.getElementById('potCountBadge');

            // Собираем все возвраты: исходные + банки с одним претендентом
            const allReturns = [...returns];
            const validPots = [];

            pots.forEach(pot => {
                if (pot.eligible.length === 1) {
                    // Банк с одним претендентом → возврат этому игроку
                    const playerIdx = pot.eligible[0];
                    allReturns.push({
                        playerIndex: playerIdx,
                        amount: pot.size,
                        note: pot.foldedContribution > 0 ? ' (включая фишки сбросившихся)' : ''
                    });
                } else {
                    validPots.push(pot);
                }
            });

            // Если нет ни банков, ни возвратов
            if (validPots.length === 0 && allReturns.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🃏</div>
                        <p>Нет активных ставок для расчёта</p>
                    </div>
                `;
                badge.textContent = '0 банков';
                return;
            }

            badge.textContent = `${validPots.length} банк${validPots.length > 1 ? 'а' : ''}`;

            let html = '<div class="pots-container">';

            // Вывод банков
            validPots.forEach((pot, idx) => {
                const cls = pot.isMain ? 'main-pot' : 'side-pot';
                const label = pot.isMain ? '⭐ Главный банк' : `🔄 Сайд-пот #${idx}`;

                const chips = pot.eligible.map(idx => {
                    const p = players.find(p => p.index === idx);
                    const isAllIn = p ? p.checkbox.checked : false;
                    return `<span class="player-chip ${isAllIn ? 'allin-chip' : ''}">
                                ${isAllIn ? '<span class="chip-icon">🔥</span>' : ''}
                                Игрок ${idx}
                            </span>`;
                }).join('');

                let foldInfo = '';
                if (pot.foldedContribution > 0) {
                    foldInfo = `<span class="fold-note">(включает ${pot.foldedContribution} фишек от сбросившихся)</span>`;
                }

                html += `
                    <div class="pot-item ${cls}">
                        <span class="pot-name">${label}</span>
                        <span class="pot-size">${pot.size} <span class="currency">фишек</span></span>
                        ${foldInfo}
                        <div class="pot-eligible">
                            <span class="label">🏆 претендуют:</span>
                            ${chips}
                        </div>
                    </div>
                `;
            });

            // Вывод возвратов (включая преобразованные банки с одним претендентом)
            allReturns.forEach(ret => {
                html += `
                    <div class="pot-item" style="border-left-color: #58a6ff88; background: #0d1117;">
                        <span class="pot-name" style="color: #8b949e;">↩️ Возврат</span>
                        <span class="pot-size" style="color: #8b949e;">${ret.amount} <span class="currency">фишек</span></span>
                        <div class="pot-eligible">
                            <span class="label">игроку:</span>
                            <span class="player-chip">Игрок ${ret.playerIndex}</span>
                        </div>
                        <div class="pot-return">${ret.note || 'избыток фишек возвращается'}</div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // ============================================================
        // 4. ОСНОВНАЯ ФУНКЦИЯ
        // ============================================================
        function performCalculation() {
            // Сначала обновим визуальное состояние folded/all-in
            const data = players.map(p => {
                const bet = parseInt(p.input.value, 10) || 0;
                const allIn = p.checkbox.checked;
                // Определяем, является ли игрок фолдером (ставка > 0, не all-in, ставка < максимума)
                // Для этого нужно знать максимум, но мы не знаем его пока. Сделаем после сбора данных.
                return { index: p.index, bet, allIn, card: p.card };
            });

            const maxBet = Math.max(...data.map(d => d.bet), 0);
            data.forEach(d => {
                if (d.bet === 0) {
                    d.card.classList.remove('all-in', 'folded');
                } else if (d.allIn) {
                    d.card.classList.add('all-in');
                    d.card.classList.remove('folded');
                } else if (d.bet < maxBet) {
                    d.card.classList.add('folded');
                    d.card.classList.remove('all-in');
                } else {
                    // ставка равна максимуму, но не all-in – активный, не фолдер
                    d.card.classList.remove('folded', 'all-in');
                }
            });

            // Теперь расчет
            const playerData = data.map(d => ({
                index: d.index,
                bet: d.bet,
                allIn: d.allIn,
            }));

            const { pots, returns } = calculatePots(playerData);
            renderResults(pots, returns);
        }

        // ============================================================
        // 5. ОЧИСТКА
        // ============================================================
        function clearAll() {
            players.forEach(p => {
                p.input.value = '';
                p.checkbox.checked = false;
                p.card.classList.remove('all-in', 'folded');
            });
            renderResults([], []);
        }

        // ============================================================
        // 6. ПРИМЕР
        // ============================================================
        function fillExample() {
            clearAll();
            const example = [
                { index: 1, bet: 100, allIn: true },
                { index: 2, bet: 200, allIn: false },
                { index: 3, bet: 300, allIn: true },
                { index: 4, bet: 500, allIn: false },
            ];
            example.forEach(({ index, bet, allIn }) => {
                const p = players.find(p => p.index === index);
                if (p) {
                    p.input.value = bet;
                    p.checkbox.checked = allIn;
                    if (allIn) p.card.classList.add('all-in');
                }
            });
            performCalculation();
        }

        // ============================================================
        // 7. СОБЫТИЯ
        // ============================================================
        document.getElementById('calcBtn').addEventListener('click', performCalculation);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('fillDemoBtn').addEventListener('click', fillExample);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'number') {
                e.preventDefault();
                performCalculation();
            }
        });

        // ============================================================
        // 8. СТАРТ
        // ============================================================
        clearAll();
        console.log('♠ Калькулятор с поддержкой Fold и автоматическим возвратом для одного претендента.');
    </script>

</body>
</html>
